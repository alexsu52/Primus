# Primus CLI System Default Configuration
# This file provides system-wide default settings for Primus CLI
#
# Priority: CLI args > User config (~/.primus.yaml) > System defaults (this file)

# Main settings (apply to all modes)
main:
  debug: false
  dry_run: false

# Slurm-specific settings
slurm:
  debug: false
  dry_run: false
  # partition: ""
  nodes: 1
  gpus_per_node: 8
  time: "4:00:00"

# Container-specific settings
container:
  debug: false
  dry_run: false

  # Docker/Podman runtime options
  # All keys directly map to CLI arguments (--key value)
  options:
    # Container image
    image: "alexsu52/rocm-primus:v26.1-fixed-rdma"
    #image: "tasimage/primus:pr-579"
    #image: "alexsu52/tasimage-primus:pr-579-fixed-rdma"
    #image: "alexsu52/tasimage-primus:pr-609-fixed-rdma"

    # Single-value options
    ipc: "host"
    network: "host"
    # cpus: "96"
    # memory: "256G"
    name: "primus-training"
    privileged: "true"
    security-opt: "seccomp=unconfined"
    group-add: "video"
    shm-size: "128G"

    # Cumulative options (can be specified multiple times via CLI)
    # Device access (each passed as --device)
    # NOTE: Do not modify these device paths - they are required for ROCm/GPU access
    #   /dev/kfd  - Kernel Fusion Driver (ROCm core)
    #   /dev/dri  - Direct Rendering Infrastructure (GPU access)
    #   /dev/infiniband - InfiniBand network device (multi-node communication)
    device:
      - "/dev/kfd"
      - "/dev/dri"
      - "/dev/infiniband"

    # Linux capabilities (each passed as --cap-add)
    # NOTE: Do not modify these capabilities - they are required for proper container operation
    #   SYS_PTRACE     - Required for debugging and profiling tools
    #   CAP_SYS_ADMIN  - Required for system administration operations
    cap-add:
      - "SYS_PTRACE"
      - "CAP_SYS_ADMIN"

    # Volume mounts (each passed as --volume)
    volume: []
    # volume:
    #   - "/data:/data"
    #   - "/output:/output"
    #   - "/workspace/Primus"
    #   - "/model_weights:/model_weights:ro"

    # Environment variables (each passed as --env KEY=VALUE)
    env:
      - "MASTER_ADDR"
      - "MASTER_PORT"
      - "NNODES"
      - "NODE_RANK"
      - "GPUS_PER_NODE"
      - "DOCKER_IMAGE"
      - "HF_TOKEN"
      - "WANDB_API_KEY"
      - "ENABLE_NUMA_BINDING"
      - "REBUILD_PRIMUS_TURBO=0"
      - "USING_AINIC"
      - "PATCH_TE_FLASH_ATTN"
      - "REBUILD_BNXT"
      - "HSA_NO_SCRATCH_RECLAIM=1"
      - "NVTE_CK_USES_BWD_V3=1"
      - "NCCL_IB_HCA=rocep28s0,rocep62s0,rocep79s0,rocep96s0,rocep158s0,rocep190s0,rocep206s0,rocep222s0"
      - "NCCL_SOCKET_IFNAME=enp159s0np0"
      - "GLOO_SOCKET_IFNAME=enp159s0np0"
      - "TP_SOCKET_IFNAME=enp159s0np0"
      - "NCCL_IB_GID_INDEX=3"
      - "PRIMUS_TURBO_ATTN_V3_ATOMIC_FP32=1"
      - "NVTE_CK_IS_V3_ATOMIC_FP32=1"
      - "TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC=600"
      - "GPU_ARCHS=gfx942"
      - "FIX_AITER_ASM_DIR=0"
      - "PRIMUS_TURBO_DEEPEP_TIMEOUT=1200"
      - "TRANSFORMERS_OFFLINE=1"
      - "HF_DATASETS_OFFLINE=1"
#      - "NCCL_DEBUG=INFO"
#      - "NCCL_PXN_DISABLE=0"
#      - "NCCL_ALGO=RING"
# Direct mode settings
direct:
  debug: false

  # Distributed training parameters
  gpus_per_node: 8
  master_port: 1234
  nnodes: 1
  master_addr: "localhost"

  # Direct mode specific options
  run_mode: "torchrun"
  script: "primus/cli/main.py"
  numa: "auto"
  log_file: ""

  # Default patch scripts and env vars
  patch: []
  env: []
